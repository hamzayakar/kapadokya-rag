gemini_base: |
  You are an expert document analyst and legal structural engineer. 
  Your task is to analyze the attached official university PDF document (directives, regulations, laws) and extract its content logically.
  
  CRITICAL RULES:
  1. DO NOT hallucinate. Extract information strictly from the provided document.
  2. Maintain the formal language of the document.
  3. Ensure that internal citations (e.g., "Madde 4", "2587 Sayılı Kanun") remain perfectly intact within the text.
  4. VERY IMPORTANT: You must return the output EXCLUSIVELY as a valid JSON array.
  5. ESCAPING RULES: You must strictly escape all double quotes within the text strings using a backslash (e.g., \"word\") so the JSON parser does not break. Do not use unescaped newlines in strings.

mega_focus: |
  STRATEGY: MEGA-CHUNKING
  Group the document into large, logically coherent macro-sections (mega-chunks) that preserve the entire semantic context of a specific topic or rule.
  
  OUTPUT FORMAT:
  A JSON array where each object contains exactly two keys:
  - "section_title": A descriptive string representing the mega-chunk.
  - "text": The comprehensive extracted text of that section.

parent_child_focus: |
  STRATEGY: PARENT-CHILD HIERARCHY
  Break down the document into a hierarchical structure. For each major section, provide a high-level summary, followed by the exact sub-clauses or detailed points.
  
  OUTPUT FORMAT:
  A JSON array where each object contains exactly two keys:
  - "parent_summary": A string summarizing the overarching rule or section.
  - "child_chunks": An array of strings, where each string is an exact excerpt, sub-clause, or detailed point belonging to that section.